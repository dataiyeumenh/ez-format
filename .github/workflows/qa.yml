name: QA/QC

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: converter/requirements.txt

      - name: Install workspace deps
        run: |
          npm ci
          npm ci --prefix frontend
          npm ci --prefix backend

      - name: Install converter deps
        run: python -m pip install -r converter/requirements.txt

      - name: Setup fixtures
        run: npm run setup:fixtures
        continue-on-error: true

      - name: QA/QC (fast CI — skip slow messy tests optional)
        run: npm run qa:ci

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: docs/qa-last-run.json
          if-no-files-found: ignore
